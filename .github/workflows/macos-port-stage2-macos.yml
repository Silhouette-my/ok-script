name: macOS Foreground Branch Guardrails

on:
  push:
    branches:
      - feature/macos-foreground-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-foreground-ok-script-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Platform-safe framework contracts
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      PYTHONIOENCODING: UTF-8
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install framework profiles
        shell: bash
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -e ".[default,web,qt,adb,ocr,dev]" "opencv-python==5.0.0.93" "pytest-subtests==0.15.0"
          python -m pip check

      - name: Run no-game framework tests
        shell: bash
        run: python -m pytest -q

      - name: Verify installed imports do not load Win32 backends
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          import sys

          import ok
          from ok.device.DeviceManager import DeviceManager
          from ok.device.capabilities import DeviceCapabilities

          forbidden = sorted(
              name
              for name in sys.modules
              if name.startswith(("win32", "pythoncom", "pywintypes", "ok.rotypes"))
          )
          if forbidden:
              raise SystemExit(f"Forbidden Windows modules loaded: {forbidden}")
          assert DeviceCapabilities().enabled_names() == ()
          assert DeviceManager is not None
          PY
